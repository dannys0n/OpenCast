<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="OpenCast: Live LLM Casting presentation by Danny Son" />
    <title>OpenCast Presentation</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://github.com/dannys0n/OpenCast" aria-label="OpenCast repository">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>OpenCast</span>
      </a>
      <div class="topbar-actions">
        <a class="text-link" href="https://github.com/dannys0n/OpenCast">Repository</a>
        <a class="text-link" href="https://github.com/dannys0n/OpenCast/raw/main/Presentation/OpenCast.pptx">Download deck</a>
        <button class="icon-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
        </button>
      </div>
    </header>

    <main class="viewer" id="viewer">
      <section class="stage" aria-label="Presentation slide">
        <button class="edge-button edge-button-left" id="previous-edge" type="button" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <figure class="slide-frame">
          <img id="slide-image" src="./slides/slide-1.png" alt="Slide 1: Live LLM Casting" />
          <figcaption class="sr-only" id="slide-caption" aria-live="polite">Slide 1 of 45: Live LLM Casting</figcaption>
        </figure>
        <button class="edge-button edge-button-right" id="next-edge" type="button" aria-label="Next slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>
      </section>

      <nav class="controls" aria-label="Presentation controls">
        <button class="control-button" id="previous-button" type="button" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          <span>Previous</span>
        </button>
        <div class="progress-group">
          <label class="sr-only" for="slide-range">Current slide</label>
          <input id="slide-range" type="range" min="1" max="45" value="1" />
          <button class="slide-count" id="overview-button" type="button" aria-label="Open slide overview" title="Slide overview">
            <span id="current-slide">1</span><span class="count-divider">/</span><span>45</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
          </button>
        </div>
        <button class="control-button" id="next-button" type="button" aria-label="Next slide">
          <span>Next</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>
      </nav>
    </main>

    <div class="overview" id="overview" role="dialog" aria-modal="true" aria-labelledby="overview-title" hidden>
      <div class="overview-panel">
        <div class="overview-header">
          <div>
            <p class="eyebrow">OpenCast</p>
            <h1 id="overview-title">Slide overview</h1>
          </div>
          <button class="icon-button" id="close-overview" type="button" aria-label="Close slide overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="thumbnail-grid" id="thumbnail-grid"></div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
